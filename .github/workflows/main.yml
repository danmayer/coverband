name: CI
# Controls when the action will run.
# Github Actions multiple gemfile support?
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # need to figure out how to use redis on macos github actions
        # os: [ubuntu, macos]
        os: [ubuntu]
        # remove until I sort out CI issues for truffle
        # truffleruby,
        # truffleruby-head,
        # removing jruby again to flaky
        gemfile: [ Gemfile.rails7.0, Gemfile.rails7.1, Gemfile.rails7.2, Gemfile.rails8.0 ]
        # need to add support for multiple gemfiles
        ruby: ["3.1", "3.2", "3.3", "3.4", "4.0", "ruby-head"]
        redis-version: [4, 5, 6, 7]
        exclude:
          # Rails 8 requires ruby 3.2+.
          - gemfile: 'rails_8.0'
            ruby: '3.1'
    runs-on: ${{ matrix.os }}-latest
    services:
      redis:
        image: redis:${{ matrix.redis-version }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      memcached:
        image: memcached:1.6
        ports:
          - 11211:11211
        options: >-
          --health-cmd "timeout 2 bash -c '</dev/tcp/127.0.0.1/11211'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      - run: bundle exec rake test:all
        env:
          # the memcached adapter has an ENV gate so local runs need no service,
          # which also meant CI never exercised it
          COVERBAND_MEMCACHED: "true"
      - run: "RUBYOPT='--enable=frozen-string-literal --debug=frozen-string-literal' bundle exec rake"
        env:
          COVERBAND_MEMCACHED: "true"
      # Solid Cache needs Rails 7.2+, and its engine changes process wide state,
      # so it runs on its own, only where it is available.
      #
      # Its gems sit in an optional bundler group, which bundler-cache does not
      # install, so the group is installed here rather than assumed present.
      - name: Solid Cache adapter tests
        if: matrix.gemfile == 'Gemfile.rails8.0'
        run: |
          bundle config set --local with solid_cache
          bundle install --jobs 4
          bundle exec rake test:solid_cache
  starndardrb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      - run: bundle exec standardrb --format github
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: node --test test/javascript/*.test.mjs
